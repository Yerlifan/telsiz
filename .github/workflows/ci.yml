# Sürekli entegrasyon: her dal gönderiminde ve her çekme isteğinde denetim ve testler
# Continuous integration: lint and tests on every branch push and every pull request
name: CI

# Dal gönderimlerinde yalnızca main, diğer dallar çekme isteği üzerinden denetlenir (iki kez çalışmasın)
# Pushes run CI only on main, other branches are checked through their pull request (no duplicate runs)
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# Aynı dal veya çekme isteği için yeni bir çalışma başlarsa eskisi iptal edilir
# A new run for the same branch or pull request cancels the previous one
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Denetim ve testler (${{ matrix.os }}, Node.js ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        node:
          - 20
          - 22
          - 24
    steps:
      - name: Depoyu al
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Node.js kur
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Geliştirme bağımlılıklarını kur
        run: npm ci

      - name: Stil ve güvenlik denetimi
        run: npm run denetle

      # Denetim başarısız olsa da testler çalışır, iki sonuç ayrı ayrı görülür
      # Tests run even if the lint step fails, so both results are visible
      - name: Birim ve sunucu testleri
        if: success() || failure()
        run: npm test

  e2e:
    name: Uçtan uca testler (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Depoyu al
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Node.js kur
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Geliştirme bağımlılıklarını kur
        run: npm ci

      - name: Chromium ve sistem bağımlılıklarını kur
        run: npx playwright install --with-deps chromium

      - name: Uçtan uca testler
        run: npm run test:e2e

      - name: Hata anındaki ekran görüntülerini ve izleri yükle
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-sonuclar
          path: e2e-sonuclar/
          if-no-files-found: ignore
          retention-days: 7

  # Kabuk betikleri (baslat.sh, tunel.sh) ShellCheck ile ve POSIX sh sözdizimiyle denetlenir
  # Shell scripts (baslat.sh, tunel.sh) are checked with ShellCheck and POSIX sh syntax checks
  shell:
    name: Kabuk betikleri (ShellCheck ve sh -n)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Depoyu al
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: ShellCheck (yoksa kur)
        run: |
          if ! command -v shellcheck > /dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends shellcheck
          fi
          shellcheck --version

      - name: ShellCheck ile denetle
        run: git ls-files -z -- '*.sh' | xargs -0 --no-run-if-empty shellcheck --shell=sh --severity=style

      - name: POSIX sözdizimi denetimi (sh -n, dash -n, bash --posix -n)
        run: |
          git ls-files -z -- '*.sh' | while IFS= read -r -d '' file; do
            echo "${file}"
            sh -n "${file}"
            if command -v dash > /dev/null 2>&1; then dash -n "${file}"; fi
            bash --posix -n "${file}"
          done

      - name: Git'te çalıştırılabilir kipte saklanmalı (100755)
        run: |
          bad=$(git ls-files -s -- '*.sh' | awk '$1 != "100755" { print $4 }')
          if [ -n "${bad}" ]; then
            echo "Çalıştırılabilir olmayan kabuk betikleri: ${bad}"
            exit 1
          fi

  # Docker imajı derlenir (gönderilmez), kapsayıcı docker-compose.yml örneğindeki
  # sertleştirmelerle başlatılır ve /api/info yanıtı, kurulum kodu ve sağlık denetimi doğrulanır
  # The Docker image is built (not pushed), the container is started with the hardening from
  # docker-compose.yml and /api/info, the setup code and the health check are verified
  docker:
    name: Docker imajı (derleme ve çalıştırma)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Depoyu al
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Compose örneğini doğrula
        run: docker compose -f deploy/docker-compose.yml config --quiet

      - name: İmajı derle
        run: docker build --pull --tag telsiz:ci .

      - name: Kapsayıcıyı başlat
        run: >-
          docker run --detach --name telsiz-ci
          --publish 127.0.0.1:3000:3000
          --read-only --tmpfs /tmp --cap-drop ALL
          --security-opt no-new-privileges:true
          --health-interval 2s --health-start-period 5s
          telsiz:ci

      - name: /api/info yanıtını bekle (en fazla 60 sn)
        run: |
          for i in $(seq 1 60); do
            code=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 2 http://127.0.0.1:3000/api/info || true)
            if [ "$code" = "200" ]; then
              echo "/api/info 200 döndü (${i}. deneme)"
              curl --silent --show-error http://127.0.0.1:3000/api/info
              echo
              exit 0
            fi
            sleep 1
          done
          echo "/api/info 60 sn içinde 200 döndürmedi (son durum: ${code})"
          exit 1

      - name: Kurulum kodu günlükte görünmeli
        run: docker logs telsiz-ci 2>&1 | grep -E '[0-9A-HJKMNP-TV-Z]{5}-[0-9A-HJKMNP-TV-Z]{5}'

      - name: Sağlık denetimi geçmeli (en fazla 60 sn)
        run: |
          for i in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' telsiz-ci)
            if [ "$status" = "healthy" ]; then
              echo "Kapsayıcı sağlıklı (${i}. deneme)"
              exit 0
            fi
            sleep 1
          done
          echo "Kapsayıcı 60 sn içinde sağlıklı duruma geçmedi (son durum: ${status})"
          exit 1

      - name: Kapsayıcı root olmayan kullanıcıyla çalışmalı
        run: test "$(docker exec telsiz-ci id -u)" != "0"

      - name: Kapsayıcı günlükleri
        if: always()
        run: docker logs telsiz-ci || true

      - name: Temizle
        if: always()
        run: docker rm --force telsiz-ci || true
