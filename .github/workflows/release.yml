# Sürüm yayını: v ile başlayan bir etiket (ör. v2.0.0) gönderilince çalışır.
# Release: runs when a tag that starts with v (for example v2.0.0) is pushed.
#
# 1. Denetim ve testler. Etiket package.json sürümüyle aynı olmalı, sürüm notları
#    CHANGELOG.md ve CHANGELOG.en.md dosyalarında bulunmalı. Başarısızsa hiçbir şey yayımlanmaz.
#    Lint and tests. The tag must match the package.json version and the release notes must be
#    in CHANGELOG.md and CHANGELOG.en.md. If anything fails, nothing is published.
# 2. Sunucu ikilileri (exe.yml) ve masaüstü uygulaması (desktop.yml) derlenir ve denenir.
#    The server binaries (exe.yml) and the desktop app (desktop.yml) are built and tested.
# 3. GitHub Release: tüm dosyalar, otomatik güncelleme bilgileri (latest.yml, latest-linux.yml,
#    kurucunun .blockmap dosyası), birleşik SHA256SUMS.txt ve CHANGELOG'dan sürüm notları.
#    GitHub Release: all files, the auto update info (latest.yml, latest-linux.yml, the installer
#    .blockmap file), a combined SHA256SUMS.txt and the notes from the CHANGELOG.
# 4. Docker imajı ghcr.io/yerlifan/telsiz (sürüm etiketi ve latest, linux/amd64 ve linux/arm64).
#    Docker image ghcr.io/yerlifan/telsiz (version tag and latest, linux/amd64 and linux/arm64).
# 5. npm paketi telsiz, npm trusted publishing (OIDC) ile tokensız ve provenance ile. NPM_TOKEN
#    gizli değişkeni yalnızca yedektir.
#    npm package telsiz, without a token through npm trusted publishing (OIDC) and with
#    provenance. The NPM_TOKEN secret is only a fallback.
name: Sürüm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Denetim ve testler
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Depoyu al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node.js kur
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Geliştirme bağımlılıklarını kur
        run: npm ci

      - name: Etiket package.json sürümüyle aynı olmalı
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::Etiket (${TAG}) package.json sürümüyle (v${version}) aynı değil."
            exit 1
          fi
          prerelease=false
          if [ "${version#*-}" != "${version}" ]; then prerelease=true; fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"

      - name: Sürüm notları CHANGELOG dosyalarında olmalı
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/surum-notlari.js "${VERSION}" > /dev/null

      - name: Stil ve güvenlik denetimi
        run: npm run denetle

      - name: Birim ve sunucu testleri
        run: npm test

  server:
    name: Sunucu ikilileri
    needs: check
    permissions:
      contents: read
    uses: ./.github/workflows/exe.yml

  desktop:
    name: Masaüstü uygulaması
    needs: check
    permissions:
      contents: read
    uses: ./.github/workflows/desktop.yml

  release:
    name: GitHub Release
    needs:
      - check
      - server
      - desktop
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Depoyu al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sunucu ikililerini indir
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: telsiz-server-*
          path: artifacts/server

      - name: Masaüstü paketlerini indir
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: telsiz-desktop-*
          path: artifacts/desktop

      - name: Dosyaları topla, denetle ve SHA256SUMS.txt üret
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          mkdir dagitim
          add() {
            name=$(basename "$1")
            if [ -e "dagitim/${name}" ]; then
              echo "::error::Aynı adlı iki dosya var: ${name}"
              exit 1
            fi
            cp "$1" "dagitim/${name}"
          }
          server_exe="telsiz-${VERSION}-server-windows-x64.exe"
          while IFS= read -r -d '' file; do
            case "$(basename "${file}")" in
              "${server_exe}" | "telsiz-${VERSION}-server-linux-x64" | "telsiz-${VERSION}-server-linux-arm64") add "${file}" ;;
              *) echo "::warning::Beklenmeyen sunucu dosyası yayına eklenmedi: ${file}" ;;
            esac
          done < <(find artifacts/server -type f -print0)
          # Otomatik güncelleme dosyaları: yalnızca bu iki bilgi dosyası ve kurucunun .blockmap dosyası
          updater_files=("latest.yml" "latest-linux.yml" "Telsiz-Kurulum-${VERSION}.exe.blockmap")
          while IFS= read -r -d '' file; do
            case "$(basename "${file}")" in
              *.exe | *.AppImage | *.deb) add "${file}" ;;
              latest.yml | latest-linux.yml | "Telsiz-Kurulum-${VERSION}.exe.blockmap") add "${file}" ;;
              *) echo "::notice::Masaüstü artifact'indeki bu dosya yayına eklenmedi: ${file}" ;;
            esac
          done < <(find artifacts/desktop -type f -print0)
          for required in "${server_exe}" "telsiz-${VERSION}-server-linux-x64" "telsiz-${VERSION}-server-linux-arm64"; do
            if [ ! -f "dagitim/${required}" ]; then
              echo "::error::Eksik sunucu dosyası: ${required}"
              exit 1
            fi
          done
          desktop_exe=$(find dagitim -maxdepth 1 -type f -name '*.exe' ! -name "${server_exe}" | wc -l)
          appimage=$(find dagitim -maxdepth 1 -type f -name '*.AppImage' | wc -l)
          deb=$(find dagitim -maxdepth 1 -type f -name '*.deb' | wc -l)
          if [ "${desktop_exe}" -lt 2 ] || [ "${appimage}" -lt 1 ] || [ "${deb}" -lt 1 ]; then
            echo "::error::Masaüstü paketleri eksik (Windows exe: ${desktop_exe}, AppImage: ${appimage}, deb: ${deb}). Kurucu ve taşınabilir exe, AppImage ve .deb gerekir."
            exit 1
          fi
          for required in "${updater_files[@]}"; do
            if [ ! -f "dagitim/${required}" ]; then
              echo "::error::Eksik otomatik güncelleme dosyası: ${required}"
              exit 1
            fi
          done
          # latest.yml ve latest-linux.yml içinde adı geçen her dosya yayında aynı adla bulunmalı ve
          # sha512 değeri tutmalı, yoksa uygulamalardaki güncelleme 404 veya doğrulama hatasıyla düşer
          node desktop/scripts/guncelleme-dosyalari.js dagitim --version "${VERSION}" --require latest.yml,latest-linux.yml
          cd dagitim
          find . -maxdepth 1 -type f -printf '%P\0' | sort -z | xargs -0 sha256sum -- > "${RUNNER_TEMP}/SHA256SUMS.txt"
          mv "${RUNNER_TEMP}/SHA256SUMS.txt" SHA256SUMS.txt
          {
            echo "### SHA256SUMS.txt"
            echo
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Sürüm notlarını CHANGELOG dosyalarından çıkar
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: node scripts/surum-notlari.js "${VERSION}" > "${RUNNER_TEMP}/surum-notlari.md"

      - name: GitHub Release oluştur veya güncelle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.check.outputs.version }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          set -euo pipefail
          notes="${RUNNER_TEMP}/surum-notlari.md"
          if gh release view "${TAG}" > /dev/null 2>&1; then
            # İş akışı yeniden çalıştırıldıysa: notlar güncellenir, dosyalar değiştirilir
            gh release edit "${TAG}" --title "Telsiz ${VERSION}" --notes-file "${notes}" --prerelease="${PRERELEASE}"
            gh release upload "${TAG}" dagitim/* --clobber
          else
            gh release create "${TAG}" dagitim/* --verify-tag --title "Telsiz ${VERSION}" --notes-file "${notes}" --prerelease="${PRERELEASE}"
          fi

  image:
    name: Docker imajı (GHCR)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/yerlifan/telsiz
    steps:
      - name: Depoyu al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: QEMU kur (arm64 derlemesi için)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Docker Buildx kur
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: İmaj etiketleri ve bilgileri
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
          flavor: |
            latest=auto

      - name: linux/amd64 imajını derle (gönderilmez, önce denenir)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: telsiz:surum-deneme
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Kapsayıcıyı başlat, /api/info ve sürümü denetle
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          docker run --detach --name telsiz-surum --publish 127.0.0.1:4230:3000 --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true telsiz:surum-deneme
          ok=false
          for _ in $(seq 1 60); do
            body=$(curl --silent --max-time 2 http://127.0.0.1:4230/api/info || true)
            if [ -n "${body}" ]; then
              echo "${body}"
              found=$(printf '%s' "${body}" | node -p "JSON.parse(require('node:fs').readFileSync(0, 'utf8')).version")
              if [ "${found}" = "${VERSION}" ]; then ok=true; fi
              break
            fi
            sleep 1
          done
          docker logs telsiz-surum
          docker rm --force telsiz-surum
          if [ "${ok}" != "true" ]; then
            echo "::error::Kapsayıcı /api/info yanıtında ${VERSION} sürümünü döndürmedi."
            exit 1
          fi

      - name: GHCR'ye giriş yap
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Çoklu mimari imajı derle ve gönder (linux/amd64, linux/arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Özet
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Docker imajı"
            echo
            echo '```'
            echo "${TAGS}"
            echo '```'
            echo "Depo herkese açık yapıldıktan sonra paketin görünürlüğü de GitHub'daki paket ayarlarından herkese açık yapılmalıdır."
          } >> "$GITHUB_STEP_SUMMARY"

  # npm trusted publishing (OIDC): npmjs.com'da telsiz paketi için güvenilen yayıncı tanımlıdır
  # (GitHub Actions, Yerlifan/telsiz, iş akışı dosyası release.yml, ortam yok). npm CLI GitHub'ın
  # kısa ömürlü OIDC kimliğini (id-token: write) npm'in tek kullanımlık yayın tokenıyla değiştirir,
  # uzun ömürlü token gerekmez. npm belgelerine göre (docs.npmjs.com/trusted-publishers) npm CLI
  # 11.5.1 veya sonrası ve Node.js 22.14.0 veya sonrası gerekir, aşağıda ikisi de denetlenir.
  # Güvenilen yayıncı iş akışı dosya adına bağlıdır: bu iş release.yml dışına (ör. çağrılan bir
  # iş akışına) taşınırsa npmjs.com'daki ayar da değiştirilmelidir.
  # NPM_TOKEN tanımlıysa yalnızca yedektir: npm önce OIDC'yi dener, değişim başarısız olursa
  # tokena düşer. OIDC çalıştığı doğrulandıktan sonra NPM_TOKEN silinebilir.
  # npm trusted publishing (OIDC): a trusted publisher is configured for the telsiz package on
  # npmjs.com (GitHub Actions, Yerlifan/telsiz, workflow file release.yml, no environment). The npm
  # CLI exchanges the short lived GitHub OIDC identity (id-token: write) for a one time npm publish
  # token, no long lived token is needed. According to the npm docs it requires npm CLI 11.5.1 or
  # later and Node.js 22.14.0 or later, both are checked below. The trusted publisher is bound to
  # the workflow file name: if this job moves out of release.yml, the setting on npmjs.com must be
  # changed too. If NPM_TOKEN is defined it is only a fallback: npm tries OIDC first and falls back
  # to the token if the exchange fails. Once OIDC is confirmed to work, NPM_TOKEN can be deleted.
  npm:
    name: npm yayını
    needs:
      - check
      - release
      - image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      # Trusted publishing için gereken en düşük sürümden yeni, sabitlenmiş npm CLI sürümü
      # A pinned npm CLI version newer than the minimum required for trusted publishing
      NPM_CLI_VERSION: 11.21.0
    steps:
      - name: Depoyu al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Yayın işinde paket yöneticisi önbelleği kullanılmaz (npm belgelerinin önerisi)
      - name: Node.js kur (npm kayıt defteri)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # setup-node'un yazdığı .npmrc ${NODE_AUTH_TOKEN} değişkenini okur, burada boş bırakılır ki
      # kurulum isteğine geçersiz bir token eklenmesin
      - name: npm CLI kur ve sürümleri denetle (trusted publishing)
        env:
          NODE_AUTH_TOKEN: ''
        run: |
          set -euo pipefail
          npm install --global "npm@${NPM_CLI_VERSION}"
          node -e "
            const [major, minor] = process.versions.node.split('.').map(Number)
            if (major < 22 || (major === 22 && minor < 14)) {
              console.error('::error::Trusted publishing Node.js 22.14.0 veya sonrasını gerektirir, bulunan ' + process.versions.node)
              process.exit(1)
            }
          "
          found=$(npm --version)
          if [ "${found}" != "${NPM_CLI_VERSION}" ]; then
            echo "::error::npm ${NPM_CLI_VERSION} bekleniyordu, bulunan ${found}"
            exit 1
          fi
          echo "Node.js $(node --version), npm ${found}"

      # NODE_AUTH_TOKEN yalnızca NPM_TOKEN tanımlıysa doludur ve yedektir. npm publish önce OIDC
      # değişimini dener, başarılıysa bu yayın için tokenın yerine kısa ömürlü yayın tokenını kullanır.
      # Provenance trusted publishing ile kendiliğinden üretilir, --provenance yine de açıkça verilir
      # (yedek token yolunda da provenance olsun diye).
      # NODE_AUTH_TOKEN is only set when NPM_TOKEN is defined and is a fallback. npm publish tries
      # the OIDC exchange first and, if it works, uses the short lived publish token instead of it.
      # Trusted publishing generates provenance by itself, --provenance is still passed explicitly
      # (so that the fallback token path also has provenance).
      - name: npm'e yayımla (trusted publishing, provenance ile)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.check.outputs.version }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          set -euo pipefail
          if npm view "telsiz@${VERSION}" version > /dev/null 2>&1; then
            echo "telsiz@${VERSION} npm'de zaten yayımlanmış, yayın adımı atlandı." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          dist_tag=latest
          if [ "${PRERELEASE}" = "true" ]; then dist_tag=next; fi
          if [ -n "${NODE_AUTH_TOKEN}" ]; then
            echo "NPM_TOKEN tanımlı, yalnızca OIDC değişimi başarısız olursa kullanılır."
          else
            echo "NPM_TOKEN tanımlı değil, yalnızca trusted publishing (OIDC) kullanılır."
          fi
          if ! npm publish --provenance --access public --tag "${dist_tag}"; then
            {
              echo "### npm yayını başarısız"
              echo
              echo "npmjs.com'daki güvenilen yayıncı ayarını (Yerlifan/telsiz, release.yml, ortam yok) denetleyin."
              echo "Ayrıntı için npm hata çıktısına bakın, ENEEDAUTH genellikle ayarın iş akışıyla eşleşmediğini gösterir."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "telsiz@${VERSION} npm'e yayımlandı (dağıtım etiketi: ${dist_tag})." | tee -a "$GITHUB_STEP_SUMMARY"
