# Bağımlılık güncellemeleri. Sunucunun çalışma zamanı bağımlılığı yoktur, yalnızca
# geliştirme araçları (acorn, playwright) ve CI eylemleri güncellenir.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    allow:
      - dependency-type: development
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
