# Telsiz için örnek nginx sunucu bloğu
# Example nginx server block for Telsiz
#
# Bu dosyayı /etc/nginx/conf.d/telsiz.conf veya sites-available altına kopyalayın,
# telsiz.ornek.com yerine kendi alan adınızı yazın, "nginx -t" ile denetleyip nginx'i
# yeniden yükleyin. Sertifika için Certbot kullanılabilir: https://certbot.eff.org
# Copy this file to /etc/nginx/conf.d/telsiz.conf or into sites-available, replace
# telsiz.ornek.com with your own domain, check it with "nginx -t" and reload nginx.
# Certbot can be used for the certificate: https://certbot.eff.org
#
# Telsiz sunucusu aynı makinede 127.0.0.1:3000 adresini dinler (deploy/telsiz.service).
# The Telsiz server listens on 127.0.0.1:3000 on the same machine (deploy/telsiz.service).

# HTTP isteklerini HTTPS adresine yönlendirir
# Redirects HTTP requests to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name telsiz.ornek.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # HTTP/2, aynı sunucuya giden eşzamanlı istekleri tek bağlantıda taşır. Bu yazım her
    # nginx sürümünde çalışır. nginx 1.25.1 ve sonrası uyarı verirse "ssl http2" yerine
    # "ssl" yazıp ayrı bir "http2 on" satırı ekleyin.
    # HTTP/2 carries concurrent requests to the server over one connection. This form works
    # on every nginx version. If nginx 1.25.1 or later warns about it, write "ssl" instead
    # of "ssl http2" and add a separate "http2 on" line.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name telsiz.ornek.com;

    # Certbot'un oluşturduğu sertifika dosyaları
    # Certificate files created by Certbot
    ssl_certificate /etc/letsencrypt/live/telsiz.ornek.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/telsiz.ornek.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;

    # Yükleme sınırı: uygulamanın varsayılan 25 MB sınırının biraz üstünde
    # Request body limit: slightly above the application's default 25 MB limit
    client_max_body_size 30m;

    # Tarayıcılar bu alan adına bundan sonra yalnızca HTTPS ile bağlanır
    # Browsers connect to this domain only over HTTPS from now on
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        # İstemci IP'si yalnızca nginx'in gördüğü adresten alınır. X-Forwarded-For eklenmez,
        # ezilir. İstemcinin gönderdiği CF-Connecting-IP silinir. Böylece sahte başlıkla hız
        # sınırları atlatılamaz.
        # The client IP is taken only from the address nginx sees. X-Forwarded-For is
        # overwritten instead of appended and a client supplied CF-Connecting-IP is removed,
        # so forged headers cannot bypass rate limits.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP "";

        # Sunucu yeni olay yoksa isteği yaklaşık 25 sn bekletir (long-poll), zaman aşımı bunun
        # üstünde olmalıdır
        # The server holds a request for about 25 s when there are no new events (long-poll),
        # so the timeout must be longer than that
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }
}
